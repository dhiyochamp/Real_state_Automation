<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PropBillion Smart System - Animated Flow Diagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1400px;
            width: 100%;
            animation: fadeInUp 1s ease-out;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            .container {
                padding: 20px;
            }
            .btn {
                padding: 10px 18px;
                font-size: 14px;
            }
        }

        /* Tooltip */
        .tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 300px;
        }

        .tooltip.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="tooltip" id="tooltip"></div>

    <script>
        let animationStep = 0;
        let animationInterval = null;
        let isPaused = false;

        const nodes = document.querySelectorAll('.node');
        const statusIcons = document.querySelectorAll('.status-icons > *');
        const tooltip = document.getElementById('tooltip');

        // Add hover effects to nodes
        nodes.forEach(node => {
            node.addEventListener('mouseenter', function(e) {
                const title = this.dataset.title;
                const desc = this.dataset.desc;
                tooltip.innerHTML = `<strong>${title}</strong><br>${desc}`;
                tooltip.classList.add('show');
            });

            node.addEventListener('mousemove', function(e) {
                tooltip.style.left = (e.clientX + 15) + 'px';
                tooltip.style.top = (e.clientY + 15) + 'px';
            });

            node.addEventListener('mouseleave', function() {
                tooltip.classList.remove('show');
            });

            node.style.cursor = 'pointer';
        });

        function startAnimation() {
            if (animationInterval) return; // Already running
            
            isPaused = false;
            animateNextStep();
            
            animationInterval = setInterval(() => {
                if (!isPaused) {
                    animateNextStep();
                }
            }, 2000);
        }

        function stopAnimation() {
            isPaused = true;
        }

        function resetAnimation() {
            clearInterval(animationInterval);
            animationInterval = null;
            animationStep = 0;
            isPaused = false;
            
            // Reset all nodes
            nodes.forEach(node => {
                node.style.opacity = '1';
                node.style.transform = 'scale(1)';
                const rect = node.querySelector('rect');
                rect.style.filter = 'url(#shadow)';
            });
            
            // Hide status icons
            statusIcons.forEach(icon => {
                icon.style.opacity = '0';
            });
        }

        function animateNextStep() {
            if (animationStep >= nodes.length) {
                // Animation complete, restart
                setTimeout(() => {
                    resetAnimation();
                    if (!isPaused) {
                        startAnimation();
                    }
                }, 2000);
                return;
            }

            // Highlight current node
            const currentNode = nodes[animationStep];
            const rect = currentNode.querySelector('rect');
            
            // Pulse effect
            currentNode.style.transition = 'all 0.5s ease';
            currentNode.style.transform = 'scale(1.1)';
            rect.style.filter = 'url(#glow)';
            
            // Show status icon
            if (animationStep > 0) {
                statusIcons[animationStep - 1].style.opacity = '1';
                statusIcons[animationStep - 1].style.transition = 'opacity 0.5s ease';
            }

            // Reset previous node
            if (animationStep > 0) {
                const prevNode = nodes[animationStep - 1];
                prevNode.style.transform = 'scale(1)';
                const prevRect = prevNode.querySelector('rect');
                prevRect.style.filter = 'url(#shadow)';
            }

            // Update stats
            const times = [0, 2, 3, 4, 7, 15, 23, 25, 40, 45];
            document.getElementById('statTime').textContent = times[animationStep] + 's';
            document.getElementById('statSteps').textContent = (animationStep + 1) + '/10';

            animationStep++;
        }

        // Auto-start animation on load
        window.addEventListener('load', () => {
            setTimeout(() => {
                startAnimation();
            }, 1000);
        });

        // Connection line animation
        const connectionLines = document.querySelectorAll('.connection-line');
        connectionLines.forEach((line, index) => {
            const length = line.getTotalLength();
            line.style.strokeDasharray = length;
            line.style.strokeDashoffset = length;
            line.style.animation = `drawLine 1s ease-in-out ${index * 0.5}s forwards infinite`;
        });

        // Add CSS animation for drawing lines
        const style = document.createElement('style');
        style.textContent = `
            @keyframes drawLine {
                from {
                    stroke-dashoffset: var(--length);
                }
                to {
                    stroke-dashoffset: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // Set line lengths
        connectionLines.forEach(line => {
            const length = line.getTotalLength();
            line.style.setProperty('--length', length);
        });
    </script>
</body>
</html>
